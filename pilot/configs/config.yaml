defaults:
  - data: synthetic
  - model: fusion
  - _self_

run_id: null
data_dir: data
splits_dir: splits
seed: 1729
split:
  unit: subject_id
  fractions: [0.6, 0.2, 0.2]
  seed: 1729
preprocess:
  fit_scope: train
  imputer: median
  scaler: standard
selection:
  checkpoint_split: val
  threshold_split: val
  threshold_grid: {start: 0.05, stop: 0.95, step: 0.01}
