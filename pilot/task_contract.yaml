schema_version: "1.0"
project: dropfusion-edu
notice: >-
  Educational fiction for research-safety-gate exercises. All data are synthetic.
  This is not a clinical study and reports no diagnostic performance.
study_scope:
  data: synthetic cohort generated by src/generate.py (1,200 subjects, 3 synthetic sites,
    2 aliquots per subject from one index visit)
  features: 24 protein-like and 96 RNA-like synthetic features
  outcomes: six synthetic 180-day outcomes SYN_T01-SYN_T06
  evaluation: internal evaluation on held-out synthetic subjects
not_performed:
  - recruitment of people or use of patient records
  - blood collection or wet-lab quantification of proteins or RNA
  - external or clinical validation
  - prediction of real diseases
ethics: no human participants; ethics review not applicable (synthetic-only)
