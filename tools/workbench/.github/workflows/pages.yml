name: Publish workbench
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production complexity ceiling and changed policy ratchet
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          npm ci --prefix tools/quality --ignore-scripts
          node --test tools/quality/complexity.test.mjs tools/quality/inventory.test.mjs
          node tools/quality/inventory.mjs --check
          base="$PUSH_BEFORE"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          node tools/quality/check.mjs "$base"
      - name: Python dependencies
        run: python -m pip install -r app/local/requirements-paper-mcp.txt -r app/local/requirements-images.txt numpy==2.5.2 opencv-contrib-python==5.0.0.93
      - name: Isolated visual workflow browser dependencies
        timeout-minutes: 5
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Browser contracts
        working-directory: app
        run: |
          npm run build:fonts
          node --test tests/browser-fonts.spec.mjs tests/bundled-fonts.spec.mjs tests/paragraph-fonts.spec.mjs tests/browser-pdf-fonts.spec.mjs
          npm test
      - name: File intake and human verdict browser regression (synthetic only)
        run: |
          python -m http.server 7851 --bind 127.0.0.1 --directory app/dist > "$RUNNER_TEMP/falsify-ui.log" 2>&1 &
          ui_server_pid=$!
          trap 'kill "$ui_server_pid"' EXIT
          npm run test:browser --prefix app
          node app/tests/paper-editor-ux.browser.cjs
          node app/tests/red-output.browser.cjs
          FALSIFY_UI_TEST_URL=http://127.0.0.1:7851/ node app/tests/paper-direct-recompose.browser.cjs
          node app/tests/harness-comparison.browser.cjs
          node --test scripts/packaging.spec.mjs
      - name: LaTeX source project browser regression (synthetic only)
        timeout-minutes: 15
        run: node app/tests/latex-source.browser.cjs
      - name: Browser PDF MuPDF contracts
        working-directory: app
        run: |
          set -euo pipefail
          chrome="$(node --input-type=module -e "import {chromium} from 'playwright'; const path=chromium.executablePath(); if(!path) process.exit(1); process.stdout.write(path);")"
          test -x "$chrome"
          if [ ! -x /usr/bin/google-chrome ]; then
            sudo ln -sfn "$chrome" /usr/bin/google-chrome
          fi
          export FALSIFY_CHROME_EXECUTABLE="${FALSIFY_CHROME_EXECUTABLE:-/usr/bin/google-chrome}"
          export BROWSER_EXECUTABLE="$FALSIFY_CHROME_EXECUTABLE"
          export PYTHON_EXECUTABLE="$(command -v python)"
          node --test --test-reporter=tap tests/browser-pdf.spec.mjs | tee "$RUNNER_TEMP/browser-pdf.tap"
          node ../scripts/assert-browser-pdf-executed.mjs "$RUNNER_TEMP/browser-pdf.tap"
      - name: Portable BLUE sources (offline only)
        run: |
          python app/examples/evidence_blue_v033/build_profile.py
          python -m unittest discover -s app/examples/evidence_blue_v033 -p "test_*.py" -q
          python -m unittest discover -s app/examples/evidence_blue_v034 -p "test_*.py" -q
          python -m unittest discover -s tools/evaluation -p "test_*.py" -q
      - name: Shared API dependencies
        working-directory: cloud/api
        run: npm ci --ignore-scripts
      - name: Shared API contracts (local Worker and D1 only)
        working-directory: cloud/api
        run: npm test
      - name: Broker and document contracts (no paid models)
        run: python -m unittest discover -s app/tests -p 'test_*.py'
      - name: Package committed source and run ZIP acceptance
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/release-source" "$GITHUB_SHA"
          node "$RUNNER_TEMP/release-source/scripts/package-release.mjs" --out-dir "$RUNNER_TEMP/release"
          archive="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive"])' "$RUNNER_TEMP/release/release-manifest.json")"
          FALSIFY_RELEASE_ZIP="$RUNNER_TEMP/release/$archive" python app/tests/test_packaged_harness.py -v
      - name: Preserve verified Pages assets
        uses: actions/upload-artifact@v4
        with:
          name: verified-app-dist
          path: app/dist
          if-no-files-found: error
  verify-windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Adapter home and CLI directory propagation (no models)
        run: |
          python -m unittest discover -s app/tests -p test_adapter_environment.py -q
          python app/tests/test_paper_analysis_transport.py
      - name: Pinned PlotTracer embedded engine (no models)
        run: |
          python -m pip install -r app/local/requirements-paper-mcp.txt -r app/local/requirements-images.txt
          python app/tests/test_paper_plottracer.py
          python app/tests/test_paper_chart_vectors.py
          python app/tests/test_paper_chart_correction.py
          python app/tests/test_paper_visual_edit.py
          python -m unittest discover -s app/tests -p "test_paper_chart_*.py"
      - name: Connection launcher dry-run contracts (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-connection.ps1
      - name: PDF editor startup configuration (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-pdf-editor-config.ps1
      - name: Companion restart and reconnect contracts (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-companion-lifecycle.ps1
      - name: Connection launcher dry-run contracts (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-connection.ps1
      - name: PDF editor startup configuration (Windows PowerShell)
        shell: powershell
        run: ./scripts/test-pdf-editor-config.ps1
      - name: Companion restart and reconnect contracts (Windows PowerShell)
        shell: powershell
        run: ./scripts/test-companion-lifecycle.ps1
  verify-macos-arm:
    runs-on: macos-15
    steps:
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adapter home and CLI directory propagation (no models)
        run: |
          python -m unittest discover -s app/tests -p test_adapter_environment.py -q
          python app/tests/test_paper_analysis_transport.py
      - name: Portable POSIX connection tests
        run: bash scripts/test-posix-connection.sh
      - name: Pinned PlotTracer embedded engine (no models)
        run: |
          python -m pip install -r app/local/requirements-paper-mcp.txt -r app/local/requirements-images.txt
          python app/tests/test_paper_plottracer.py
          python app/tests/test_paper_chart_vectors.py
          python app/tests/test_paper_chart_correction.py
          python app/tests/test_paper_visual_edit.py
          python -m unittest discover -s app/tests -p "test_paper_chart_*.py"
      - name: Run real macOS handler bundle test
        run: bash scripts/test-macos-handler.sh
  verify-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adapter home and CLI directory propagation (no models)
        run: |
          python -m unittest discover -s app/tests -p test_adapter_environment.py -q
          python app/tests/test_paper_analysis_transport.py
      - name: Portable POSIX connection tests
        run: bash scripts/test-posix-connection.sh
      - name: Pinned PlotTracer embedded engine (no models)
        run: |
          python -m pip install -r app/local/requirements-paper-mcp.txt -r app/local/requirements-images.txt
          python app/tests/test_paper_plottracer.py
          python app/tests/test_paper_chart_vectors.py
          python app/tests/test_paper_chart_correction.py
          python app/tests/test_paper_visual_edit.py
          python -m unittest discover -s app/tests -p "test_paper_chart_*.py"
      - name: Run real macOS handler bundle test
        run: bash scripts/test-macos-handler.sh
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, verify-windows-launcher, verify-macos-arm, verify-macos-intel]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-app-dist
          path: app/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
